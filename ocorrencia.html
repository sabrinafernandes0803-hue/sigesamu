<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGESAMU - Cadastro de Ocorrência</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #d00000;
            min-height: 100vh;
        }

        /* Cabeçalho */
        header {
            background-color: #ffffff;
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            width: 38px;
            height: 38px;
        }

        .brand h1 {
            font-size: 1.25rem;
            color: #000;
            font-weight: bold;
        }

        .btn-sair {
            color: #d00000;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
        }

        /* Layout Centralizado */
        .container {
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .card-form {
            background-color: #ffffff;
            width: 100%;
            max-width: 750px;
            padding: 35px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .form-title {
            color: #cc0000;
            font-size: 1.3rem;
            margin-bottom: 4px;
        }

        .form-subtitle {
            color: #666;
            font-size: 0.88rem;
            margin-bottom: 25px;
        }

        /* Grid e Campos do Formulário */
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .w-full { flex: 1 1 100%; }
        .w-50 { flex: 1 1 50%; }

        label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #222;
        }

        input[type="text"],
        input[type="datetime-local"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            color: #333;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #888;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Botões */
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 25px;
        }

        .btn-limpar {
            background-color: #cccccc;
            color: #333;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-salvar {
            background-color: #8b0000;
            color: #ffffff;
            border: none;
            padding: 10px 22px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-limpar:hover { background-color: #bbb; }
        .btn-salvar:hover { background-color: #6b0000; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <img src="logo/logo_sigesamu.png" alt="Logo SAMU" class="logo-img">
            <h1>SIGESAMU - Sistema de Gestão</h1>
        </div>
        <a href="#" class="btn-sair">Sair</a>
    </header>

    <main class="container">
        <div class="card-form">
            <h2 class="form-title">Cadastro de Ocorrência </h2>
            <p class="form-subtitle">Preencha os dados do chamado recebido</p>

            <form>
                <div class="form-row">
                    <div class="form-group w-50">
                        <label for="solicitante">Nome do Solicitante *</label>
                        <input type="text" id="solicitante" placeholder="Nome de quem ligou" required>
                    </div>
                    <div class="form-group w-50">
                        <label for="telefone">Telefone de Contato *</label>
                        <input type="text" id="telefone" placeholder="(00) 00000-0000" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group w-50">
                        <label for="dataHora">Data e Hora do Chamado *</label>
                        <input type="datetime-local" id="dataHora" required>
                    </div>
                    <div class="form-group w-50">
                        <label for="tipoOcorrencia">Tipo de Ocorrência *</label>
                        <select id="tipoOcorrencia" required>
                            <option value="" disabled selected>Selecione...</option>
                            <option value="clinico">Clínico (Ex: Desmaio, Infarto)</option>
                            <option value="trauma">Trauma (Ex: Acidente, Queda)</option>
                            <option value="obstetrico">Obstétrico (Ex: Parto)</option>
                            <option value="psiquiatrico">Psiquiátrico</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group w-full">
                        <label for="descricao">Descrição dos Fatos / Queixa Principal *</label>
                        <textarea id="descricao" placeholder="Descreva brevemente a situação informada pelo solicitante..." required></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="reset" class="btn-limpar">Limpar Formulário</button>
                    <button type="submit" class="btn-salvar">Salvar Ocorrência</button>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
